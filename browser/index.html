<!doctype html><meta charset="utf-8"><title>CloakTix — preuve WASM dans le navigateur</title>
<script type="module">
import * as bg from '/zkir/midnight_zkir_wasm_bg.js';
const t0 = performance.now();
const bytes = await (await fetch('/zkir/midnight_zkir_wasm_bg.wasm')).arrayBuffer();
const { instance } = await WebAssembly.instantiate(bytes, { './midnight_zkir_wasm_bg.js': bg });
bg.__wbg_set_wasm(instance.exports); instance.exports.__wbindgen_start();
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (u) => { let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };
// Les clés et paramètres SRS sont des données publiques, servies par le site (comme le ferait la dapp).
const kmp = {
  lookupKey: async (loc) => { const r = await fetch('/km?loc=' + encodeURIComponent(loc)); if (r.status === 404) return undefined; const j = await r.json(); return { proverKey: b64d(j.proverKey), verifierKey: b64d(j.verifierKey), ir: b64d(j.ir) }; },
  getParams: async (k) => new Uint8Array(await (await fetch('/params/' + k)).arrayBuffer()),
};
window.zk = {
  loadMs: performance.now() - t0,
  check: async (p) => (await bg.check(b64d(p), kmp)).map((x) => (x === undefined ? null : x.toString())),
  prove: async (p, ob) => { const t = performance.now(); const r = await bg.prove(b64d(p), kmp, ob === null ? undefined : BigInt(ob)); return { proof: b64e(r), ms: performance.now() - t }; },
};
window.zkReady = true;
</script>
